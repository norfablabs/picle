extra:
  social:
  - icon: fontawesome/brands/github-alt
    link: https://github.com/dmulyalin
  - icon: fontawesome/brands/twitter
    link: https://twitter.com/DMulyalin
markdown_extensions:
- admonition
- pymdownx.details
- attr_list
- md_in_html
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
nav:
- Overview: 
  - Overview: index.md
  - Changelog: changelog.md
- Getting Started: Getting Started.md
- Features:
  - Command Discovery: features/command_discovery.md
  - Field Aliases: features/field_aliases.md
  - Input Parsing: features/input_parsing.md
  - Pipes: features/pipes.md
  - Filters and Outputters: features/filters_and_outputters.md
  - Presence: features/fields_presence.md
  - Processors: features/processors.md
  - Multiline Input: features/multiline_input.md
  - Chat Interface: features/chat_interface.md
  - Result Specific Outputters: features/result_specific_outputters.md
  - Subshells and Navigation: features/subshells_and_navigation.md
  - Shell Commands: features/shell_commands.md
  - Mounting Shell Models: features/mounting_models_at_runtime.md
  - Configuration Model: features/configuration_model.md
  - Dynamic Dictionaries: features/dynamic_dictionary_input.md
- API Reference: api_reference.md
- Development:
  - 'ADR-001: Multiline Chat Input': development/adr-001-multiline-chat-input.md
  - 'ADR-002: SSH Server Support': development/adr-002-ssh-server-support.md
plugins:
- search
- mkdocstrings:
    handlers:
      python:
        options:
          docstring_section_style: list
          heading_level: 3
          merge_init_into_class: true
          show_object_full_path: true
          show_root_heading: true
          show_root_toc_entry: true
          show_signature_annotations: true
          docstring_style: google
repo_name: dmulyalin/picle
repo_url: https://github.com/dmulyalin/picle
site_author: Denis Mulyalin
site_description: Python Interactive Command Line Shells
site_name: PICLE
site_url: https://picle.github.io/
theme:
  custom_dir: docs/overrides
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.sections
  - navigation.top
  - toc.follow
  icon:
    repo: fontawesome/brands/github-alt
  logo: images/logo_small.jpg
  name: material
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: black
    accent: black
    toggle:
      icon: material/brightness-4
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: black
    accent: black
    toggle:
      icon: material/brightness-7
      name: Switch to light mode
